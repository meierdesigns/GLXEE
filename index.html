    <!-- Critical boot loader paint: visible before the large styles.css arrives (css/styles/part-*.css) -->
    <style id="vf-boot-critical">
        html, body { margin: 0; background: #05060a; }
        #vf-boot-veil.vf-boot-veil-loading {
            position: fixed; inset: 0; z-index: 9980; pointer-events: auto;   /* under the bezel (9990): the screen frame is already there while loading */
            display: flex; align-items: center; justify-content: center;
            background: #05060a; color: #c8d0d8;
            font-family: 'Silkscreen', ui-monospace, monospace;
            image-rendering: pixelated;
        }
        #vf-boot-loader {
            width: min(420px, 86vw); padding: 28px 24px 22px;
            border: 4px solid #2a3340; background: #0a0d12;
            box-shadow: 0 0 0 2px #05060a, 0 0 0 6px #1a222c;
            text-align: center; letter-spacing: 0.06em;
        }
        #vf-boot-loader .vf-boot-brand {
            font-size: clamp(28px, 6vw, 40px); font-weight: 700; color: #f2f4f7;
            margin: 0 0 6px; text-shadow: 0 0 18px rgba(58, 110, 165, 0.45);
        }
        #vf-boot-loader .vf-boot-channel {
            font-size: 11px; color: #6f7f92; margin: 0 0 22px; text-transform: uppercase;
        }
        #vf-boot-track {
            position: relative; overflow: hidden; direction: ltr;
            height: 14px; border: 3px solid #3a4656; background: #05070b;
            padding: 2px; box-sizing: border-box; margin: 0 0 12px;
        }
        #vf-boot-bar {
            display: block; height: 100%; width: 100%; position: relative; z-index: 1;
            transform: scaleX(0); transform-origin: left center;
            background: linear-gradient(90deg, #2a5f9e, #5aa0e8 55%, #b8d8ff);
            box-shadow: 0 0 10px rgba(90, 160, 232, 0.35);
            transition: transform 0.12s linear;
        }
        #vf-boot-track::after {
            content: ''; position: absolute; inset: 2px auto 2px 0; width: 28%; z-index: 2;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            animation: vf-boot-sweep 1.2s linear infinite; pointer-events: none;
        }
        #vf-boot-loader.is-done #vf-boot-track::after { display: none; }
        @keyframes vf-boot-sweep {
            from { transform: translateX(-120%); }
            to { transform: translateX(380%); }
        }
        #vf-boot-meta {
            display: flex; justify-content: space-between; gap: 12px;
            font-size: 11px; color: #8fa0b4; text-transform: uppercase;
        }
        #vf-boot-pct { color: #d7e6f7; min-width: 3.2em; text-align: right; }
        #vf-boot-loader.is-done #vf-boot-status { color: #7dff9a; }
        @media (prefers-reduced-motion: reduce) {
            #vf-boot-bar { transition: none; }
        }

    </style>

    <script>try{var gs=window.vfGuiPreview||window.vfGuiState;if(gs&&gs.id){var bz=document.getElementById("vf-bezel");bz.setAttribute("data-faction",gs.id);if(window.vfGuiPreview)bz.setAttribute("data-preview","1")}}catch(e){}</script>
    <script>
    /* Pixel-frame boot: the cached look is applied before the first paint (attributes, cell vars and the
       filter itself), so the frame never starts smooth and then jumps. ui-appearance.js reuses the builder. */
    window.vfBuildFramePxFilter=function(c){
      var half=Math.max(1,Math.floor(c/2)),cell=half*2+1;
      var svg=document.getElementById("vfFramePxSvg");
      if(!svg){
        svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
        svg.id="vfFramePxSvg";svg.setAttribute("width","0");svg.setAttribute("height","0");
        svg.style.position="absolute";svg.setAttribute("aria-hidden","true");
        document.body.appendChild(svg);
      }
      /* One sample per odd cell, dilated back to exact square cells; square cells; only a faint light/shade on cell
         edges from the top-left so the grid stays readable without looking laid over. */
      svg.innerHTML='<filter id="vfFramePx" x="-1%" y="-1%" width="102%" height="102%" color-interpolation-filters="sRGB">'+
        '<feFlood x="'+half+'" y="'+half+'" width="1" height="1"/>'+
        '<feComposite width="'+cell+'" height="'+cell+'"/><feTile result="t"/>'+
        '<feComposite in="SourceGraphic" in2="t" operator="in"/>'+
        '<feMorphology operator="dilate" radius="'+half+'" result="px"/>'+
        '<feOffset in="px" dx="'+cell+'" dy="0" result="aL"/><feComposite in="px" in2="aL" operator="out" result="eL"/>'+
        '<feOffset in="px" dx="0" dy="'+cell+'" result="aU"/><feComposite in="px" in2="aU" operator="out" result="eU"/>'+
        '<feMerge result="litM"><feMergeNode in="eL"/><feMergeNode in="eU"/></feMerge>'+
        '<feOffset in="px" dx="-'+cell+'" dy="0" result="aR"/><feComposite in="px" in2="aR" operator="out" result="eR"/>'+
        '<feOffset in="px" dx="0" dy="-'+cell+'" result="aD"/><feComposite in="px" in2="aD" operator="out" result="eD"/>'+
        '<feMerge result="shM"><feMergeNode in="eR"/><feMergeNode in="eD"/></feMerge>'+
        '<feFlood flood-color="#ffffff" flood-opacity="0.1" result="fw"/><feComposite in="fw" in2="litM" operator="in" result="litC"/>'+
        '<feFlood flood-color="#000000" flood-opacity="0.16" result="fb"/><feComposite in="fb" in2="shM" operator="in" result="shC"/>'+
        '<feMerge><feMergeNode in="px"/><feMergeNode in="litC"/><feMergeNode in="shC"/></feMerge></filter>';
    };
    (function(){try{
      var d=JSON.parse(localStorage.getItem("vf_uiAppearance")||"null");if(!d)return;
      var r=document.documentElement;
      if(d.guiVoxel==="ON"||d.guiVoxel===undefined){r.setAttribute("data-vf-gui-voxel","on");}
      var parts=d.guiVoxelParts||{};["lines","corners","text","images","svg"].forEach(function(k){r.setAttribute("data-vf-gv-"+k,parts[k]==="OFF"?"off":"on");});
      var fp=Number(d.framePx);
      if(d.framePx&&d.framePx!=="OFF"&&fp>0){
        var odd=Math.floor(fp/2)*2+1,rad=odd*2*(/^[0-8]$/.test(String(d.frameRound))?Number(d.frameRound):3);
        r.setAttribute("data-vf-frame-px","on");
        r.style.setProperty("--fr-px",odd+"px");r.style.setProperty("--fr-rad",rad+"px");
        r.style.setProperty("--fr-out",(rad>0?rad+odd*3:0)+"px");
        window.vfBuildFramePxFilter(odd);
      }
    }catch(e){}})();

    <script>
        // Initialize game when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {

            // Create global game instance
            game = new GameCore();

            // Initialize the game
            game.init();

            function refreshViewportAfterControls() {
                if (window.viewportFit && typeof window.viewportFit.scheduleUpdate === 'function') {
                    window.viewportFit.scheduleUpdate();
                }
            }

            const hideCtrl = document.getElementById('hideGameControls');
            const showCtrl = document.getElementById('showGameControls');
            if (hideCtrl) {
                hideCtrl.addEventListener('click', function () {
                    if (typeof uiAppearanceManager !== 'undefined') {
                        uiAppearanceManager.setControlsHints('OFF');
                        refreshViewportAfterControls();
                    }
                });
            }
            if (showCtrl) {
                showCtrl.addEventListener('click', function () {
                    if (typeof uiAppearanceManager !== 'undefined') {
                        uiAppearanceManager.setControlsHints('ON');
                        refreshViewportAfterControls();
                    }
                });
            }
        });
